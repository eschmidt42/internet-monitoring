---
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert.rules

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://www.google.com
          - https://www.cloudflare.com
          - https://www.gstatic.com/generate_204
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: 'ping'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files:
          - /etc/prometheus/pinghosts.yml
        refresh_interval: 5m
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*);(.*)'
        replacement: '${1}'
        target_label: __param_target
      - source_labels: [__address__]
        regex: '(.*);(.*)'
        replacement: '${2}'
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
