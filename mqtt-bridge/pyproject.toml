[project]
name = "mqtt-bridge"
version = "0.1.0"
description = "A MQTT bridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "paho-mqtt==2.1.0",
    "gunicorn==23.0.0"
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.10",
    "ty>=0.0.29",
]

[build-system]
requires = ["uv_build>=0.6.6,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
