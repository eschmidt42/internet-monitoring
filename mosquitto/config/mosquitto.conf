# Mosquitto MQTT broker configuration

# Listen on all interfaces (LAN reachable)
listener 1883

# Disable anonymous access — clients must authenticate
allow_anonymous false

# Password file (generate with: mosquitto_passwd -c /mosquitto/config/mosquitto.passwd <username>)
password_file /mosquitto/config/mosquitto.passwd

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
