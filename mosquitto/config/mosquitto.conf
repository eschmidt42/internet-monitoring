# Mosquitto MQTT broker configuration

# Listen on all interfaces (LAN reachable)
listener 1883

# Allow anonymous connections so that MQTT client apps (e.g. MQTTAnalyzer on iOS)
# can complete their anonymous broker-reachability probe during connection setup.
# Authenticated clients still use the password file below.
# Risk is low since port 1883 is only exposed on the LAN.
allow_anonymous true

# Password file (generate with: mosquitto_passwd -c /mosquitto/config/mosquitto.passwd <username>)
password_file /mosquitto/config/mosquitto.passwd

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
